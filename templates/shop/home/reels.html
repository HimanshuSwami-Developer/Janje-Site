{% load studio_tags %}
{% if reels %}
<section class="max-w-[1200px] mx-auto pt-[72px] flex flex-col gap-[22px]" id="reels">
<div class="flex flex-wrap items-end justify-between gap-3 px-5">
<div class="flex flex-col gap-1">
<h2 class="m-0 font-hand text-[42px] sm:text-[56px] font-bold leading-none">{% txt "home.reels.title" "Fresh from our reels" %}</h2>
<span class="text-[15px] text-cocoa-soft">{% txt "home.reels.subtitle" "Swipe and tap to watch on Instagram" %}</span>
</div>
<a class="pill inline-flex items-center gap-2 px-5 py-3 rounded-full bg-blush text-cocoa no-underline font-extrabold" href="{{ instagram_url }}" rel="noopener" target="_blank">
<svg aria-hidden="true" fill="none" height="18" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="18"><rect height="18" rx="5" width="18" x="3" y="3"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.5" cy="6.5" fill="currentColor" r="1"></circle></svg>@{{ instagram_handle }}</a>
</div>
<div class="hscroll grid grid-flow-col auto-cols-[minmax(190px,230px)] gap-4 px-5 pt-1 pb-4">
{% for reel in reels %}
<a aria-label="Watch reel: {{ reel.title }}" class="snap lift relative block aspect-[9/16] rounded-[22px] overflow-hidden no-underline text-white border-[5px] border-white shadow-[0_10px_28px_rgba(180,72,95,0.14)]" href="{{ reel.reel_url|default:instagram_url }}" rel="noopener" target="_blank">
<img alt="" class="absolute inset-0 w-full h-full object-cover" loading="lazy" src="{{ reel.image_src }}"/>
<span class="absolute inset-0" style="background: linear-gradient(180deg, rgba(74,44,38,0) 50%, rgba(74,44,38,0.75) 100%)"></span>
<span class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-14 h-14 rounded-full bg-white/90 flex items-center justify-center text-berry"><svg aria-hidden="true" fill="currentColor" height="22" viewBox="0 0 24 24" width="22"><path d="M8 5v14l11-7z"></path></svg></span>
<span class="absolute left-3 right-3 bottom-3 font-extrabold text-[15px] leading-tight">{{ reel.title }}</span>
</a>
{% endfor %}
</div>
</section>
{% endif %}
