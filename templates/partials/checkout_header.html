<header class="bg-cream border-b-2 border-dashed border-blush-line">
<div class="max-w-[1100px] mx-auto px-5 py-2.5 flex flex-wrap items-center justify-between gap-2.5">
<a class="font-script text-[34px] font-bold text-berry no-underline leading-none" href="{% url 'shop:home' %}">Janjé</a>
<ol aria-label="Checkout steps" class="list-none m-0 p-0 flex items-center gap-1.5 text-[13px] font-extrabold">
<li class="px-2.5 sm:px-3 py-1.5 sm:py-2 rounded-full {% if step == 'done' %}bg-white text-cocoa-soft{% else %}bg-white{% endif %}">{% if step == 'done' %}Cart{% else %}<a class="text-cocoa-soft no-underline" href="{% url 'shop:cart' %}">Cart</a>{% endif %}</li>
<li aria-hidden="true" class="text-blush-deep">··</li>
<li {% if step == 'details' %}aria-current="step"{% endif %} class="px-2.5 sm:px-3 py-1.5 sm:py-2 rounded-full {% if step == 'details' %}bg-berry text-white{% else %}bg-white text-cocoa-soft{% endif %}">Details</li>
<li aria-hidden="true" class="text-blush-deep">··</li>
<li {% if step == 'done' %}aria-current="step"{% endif %} class="px-2.5 sm:px-3 py-1.5 sm:py-2 rounded-full {% if step == 'done' %}bg-berry text-white{% else %}bg-white text-cocoa-soft{% endif %}">Done</li>
</ol>
</div>
</header>
