<section aria-label="Shop by category" class="max-w-[1200px] mx-auto pt-6 pb-2">
<div class="hscroll flex gap-[18px] px-5 py-2" style="justify-content: safe center">
{% for cat in categories %}
<a class="js-filter snap lift flex-none w-28 flex flex-col items-center gap-2 no-underline text-cocoa" data-filter="{{ cat.slug }}" href="#shop">
<img alt="" class="js-cat-ring w-24 h-24 object-cover rounded-full border-4 border-white shadow-[0_0_0_2px_rgb(var(--c-line))]" loading="lazy" src="{{ cat.image_src }}"/>
<span class="font-extrabold text-sm text-center">{{ cat.pill_name }}</span>
</a>
{% endfor %}
</div>
</section>
